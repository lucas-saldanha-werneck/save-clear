name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_hooks.py -v
      - run: (command -v tmux || sudo apt-get install -y tmux || brew install tmux) && bash tests/run.sh
